# 生产：所有凭据由环境变量/密钥托管注入，禁止写入镜像与配置文件
spring:
  datasource:
    url: ${MYSQL_JDBC_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
  flyway:
    enabled: true

# 默认 real：真实 SDK 未接入时，调用会抛明确异常，绝不会静默使用模拟数据。
# 完成银行/发票/CA 三家联调前，禁止将本配置用于生产发布。
freight:
  integration:
    mode: ${INTEGRATION_MODE:real}

logging:
  level:
    com.lukachangtong.freight: INFO
