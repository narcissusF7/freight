# 自包含冒烟测试配置：不依赖任何外部 MySQL / Redis / 外部 SDK
# 通过 @ActiveProfiles("unittest") 激活；H2 内存库 + 关闭 Flyway，验证应用上下文可正常加载。
spring:
  datasource:
    url: jdbc:h2:mem:freight;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  # 单测不依赖外部 Redis；排除其自动配置，避免启动连本机 6379 失败
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.redisson.spring.starter.RedissonAutoConfiguration

# 外部集成强制走本地模拟（与 dev 一致），证明 mock 实现可被 Spring 正常装配
freight:
  integration:
    mode: mock

logging:
  level:
    com.lukachangtong.freight: INFO
